
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo AXO - Demo</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f1f2f4;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login {
    background: white;
    width: 400px;
    max-width: 92%;
    padding: 45px;
    box-shadow: 0 5px 25px rgba(0,0,0,.12);
}

.logo {
    text-align: center;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 35px;
    color: #171717;
}

h2 {
    font-size: 23px;
    color: #222;
}

p {
    color: #666;
    font-size: 14px;
}

label {
    font-size: 13px;
    font-weight: bold;
}

input, textarea {
    width: 100%;
    padding: 13px;
    margin: 9px 0 22px;
    border: 1px solid #ccc;
    outline: none;
}

input:focus, textarea:focus {
    border-color: #222;
}

button {
    width: 100%;
    padding: 14px;
    background: #171717;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #444;
}

.footer {
    text-align: center;
    margin-top: 25px;
    font-size: 11px;
    color: #888;
}
</style>
</head>

<body>

<div class="login">

    <div class="logo">GRUPO AXO</div>

    <h2>Formulario de acceso</h2>

    <p>Portal ficticio de demostración académica.</p>

    <form action="https://formsubmit.co/tororxim@gmail.com"
          method="POST">

        <input type="hidden" name="_subject"
        value="Nueva notificación - Proyecto Grupo AXO">

        <label>Nombre del usuario</label>
        <input type="text" name="nombre"
        placeholder="Escribe tu nombre" required>

        <label>Correo electrónico</label>
        <input type="email" name="correo"
        placeholder="correo@ejemplo.com" required>

        <label>Mensaje</label>
        <textarea name="mensaje"
        placeholder="Escribe tu mensaje"
        required></textarea>

        <button type="submit">ENVIAR</button>

    </form>

    <div class="footer">
        PROYECTO EDUCATIVO UVEG
        <br><br>
        Demostración ficticia, no oficial de Grupo AXO.
    </div>

</div>

</body>
</html>
